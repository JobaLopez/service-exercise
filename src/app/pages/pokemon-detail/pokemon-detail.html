<div>
    <input (keydown.enter)="onSubmit()" class="border border-gray-400 py-1 px-2 rounded-bl-md rounded-tl-md" type="text"
        [formField]="pokemonSearchForm.searchTerm" />
    <button class="border border-blue-400 border-l-blue-200 bg-blue-200 py-1 px-2 rounded-br-md rounded-tr-md"
        (click)="onSubmit()">Search</button>
</div>
<p class="text-red-600">
    @if (showError()) {
    There was an error
    }
</p>

<img class="mx-auto" [src]="pokemon()?.sprites?.front_default" [alt]="`Front default sprite of ${pokemon()?.name}`" />
<h1 class="mx-auto text-xl w-fit">{{ pokemon()?.name | titlecase }}</h1>
<div class="mt-3 flex fex-col gap-2 justify-center">
    @for (pokemonType of pokemon()?.types; track $index) {
    <p class="border py-1 px-3 rounded-sm">{{ pokemonType.type.name | titlecase }}</p>
    }
</div>
